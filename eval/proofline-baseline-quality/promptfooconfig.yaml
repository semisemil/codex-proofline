# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Proofline baseline-quality 미적용·적용 비교
sharing: false

extensions:
  - file://extensions/isolate-workspace.mjs:extensionHook

prompts:
  - id: file://prompts/task.txt
    label: 동일 사용자 요청

providers:
  - id: file://providers/codex-thread.mjs
    label: Proofline 없음
    config:
      condition: control
      model: gpt-5.6-sol
      model_reasoning_effort: medium
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_mode: disabled
  - id: file://providers/codex-thread.mjs
    label: Proofline 적용
    config:
      condition: treatment
      model: gpt-5.6-sol
      model_reasoning_effort: medium
      sandbox_mode: workspace-write
      approval_policy: never
      network_access_enabled: false
      web_search_mode: disabled

tests: file://tests/*.yaml
