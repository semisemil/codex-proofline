<!doctype html>
<html lang="ko">
  <body>
    <main aria-labelledby="page-title">
      <h1 id="page-title">Workspace Settings</h1>
      <section aria-labelledby="retention-title">
        <h2 id="retention-title">데이터 보존</h2>
        <p class="description">여기에서 데이터 보존 기간을 설정할 수 있습니다.</p>
        <label for="retention-days">보존 기간</label>
        <select id="retention-days" name="retentionDays">
          <option value="30">30 days</option>
          <option value="90">90 days</option>
        </select>
        <p class="help">선택된 기간 이후에는 데이터가 삭제되게 됩니다.</p>
      </section>
      <button type="submit">Save configuration</button>
      <a href="/settings">설정 취소</a>
    </main>
  </body>
</html>
