- description: 부정 사례 2 - 조건과 예외가 있는 계획 검토
  metadata:
    case: 05-critical-plan-review
    category: 부정 사례
  vars:
    request: |-
      `plans/migration.md`의 주장을 `evidence/incident-summary.md`와 대조해서 비판적으로 검토해줘.

      결론, 영향, 근거, 남은 불확실성과 다음 조치를 구분해서 한국어로 알려줘. 실제 계획보다 강한 주장으로 바꿔서 반박하지 말고, 파일은 수정하지 마.
  assert:
    - type: javascript
      value: file://assertions/skill-routing.mjs
      metric: 스킬 호출 정확성
    - type: javascript
      value: file://assertions/plan-review.mjs
      metric: 검토 충실성과 무변경
