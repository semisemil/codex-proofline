- description: 정상 동작 3 - 설정 화면의 지정 문구 수정
  metadata:
    case: 03-settings-copy
    category: 정상 동작
  vars:
    request: |-
      `src/settings.html`에서 `data-testid="retention-note"`인 안내 문구 하나만 자연스러운 한국어로 바꿔줘.

      사용자가 알아야 할 내용은 로그가 30일 동안 보관된다는 사실뿐이야. 내부 필드명이나 마이그레이션 설명은 노출하지 마. 해당 요소의 태그와 속성, 제목, 버튼, 다른 안내 문구는 그대로 두고 다른 파일은 수정하지 마.
  assert:
    - type: javascript
      value: file://assertions/skill-routing.mjs
      metric: 스킬 호출 정확성
    - type: javascript
      value: file://assertions/ui-copy.mjs
      metric: UI 문구와 수정 범위
