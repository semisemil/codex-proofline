- description: 정상 동작 4 - 네 가지 기술 개념의 표현 압축
  metadata:
    case: 07-expression-compression
    category: 정상 동작
  vars:
    request: |-
      1. 스레드와 프로세스의 차이를 설명해줘. 2. 같은 프로그램이 어떤 컴퓨터에서는 빠르고 어떤 컴퓨터에서는 느린 이유가 뭐야? 3. 기술 부채가 쌓이면 개발 속도가 왜 느려져? 4. 작은 모델이 큰 모델보다 실제 서비스에서 더 유리한 경우를 설명해줘.
  assert:
    - type: javascript
      value: file://assertions/skill-routing.mjs
      metric: 스킬 호출 정확성
    - type: javascript
      value: file://assertions/expression-compression.mjs
      metric: 기술 설명 충실성
