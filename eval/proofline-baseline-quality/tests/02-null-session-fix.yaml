- description: 정상 동작 2 - null 세션 로그인 오류 수정
  metadata:
    case: 02-null-session-fix
    category: 정상 동작
  vars:
    request: |-
      `null` 세션에서 로그인 상태를 확인하면 오류가 나는 문제를 고쳐줘.

      `src/session.js`만 수정해서 `getLoginState(null)`이 `{ authenticated: false, userId: null }`을 반환하게 하고, 정상 세션의 기존 동작은 유지해. 다른 파일은 수정하지 말고 `node test/session.test.js`로 검증한 뒤 결과를 알려줘.
  assert:
    - type: javascript
      value: file://assertions/skill-routing.mjs
      metric: 스킬 호출 정확성
    - type: javascript
      value: file://assertions/session-fix.mjs
      metric: 수정 범위와 검증
