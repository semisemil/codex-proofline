<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proofline Issue Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <div>
      <p class="eyebrow">Proofline</p>
      <h1>Issue Dashboard</h1>
      <p class="description">
        원본은 <code>.proofline/issues/*.md</code>입니다. 이 화면 파일은 고정되어 있고,
        보통 이슈 등록 중에는 수정하지 않습니다.
      </p>
    </div>
  </header>

  <main class="layout">
    <section id="folder-status" class="folder-strip" data-status="loading" aria-labelledby="load-title">
      <div class="folder-copy">
        <h2 id="load-title">Issues folder</h2>
        <p id="load-status" class="status-message">저장된 issues 폴더에 자동 연결하는 중입니다.</p>
      </div>

      <div class="folder-actions">
        <button id="reload-button" type="button">다시 읽기</button>
        <button id="connect-button" type="button">초기 폴더 설정</button>
        <button id="change-folder-button" type="button" hidden>폴더 재지정</button>
        <label id="folder-picker" class="file-button" hidden>
          <span>issues 폴더 선택</span>
          <input id="folder-input" type="file" accept=".md" webkitdirectory multiple>
        </label>
      </div>
    </section>

    <section class="summary-grid" aria-label="Issue summary">
      <article class="summary-card">
        <span>Total</span>
        <strong id="summary-total">0</strong>
      </article>
      <article class="summary-card">
        <span>Open</span>
        <strong id="summary-open">0</strong>
      </article>
      <article class="summary-card">
        <span>Blocked</span>
        <strong id="summary-blocked">0</strong>
      </article>
      <article class="summary-card">
        <span>Resolved</span>
        <strong id="summary-resolved">0</strong>
      </article>
    </section>

    <section class="filters" aria-labelledby="filter-title">
      <h2 id="filter-title">필터</h2>
      <div class="filter-row">
        <label>
          검색
          <input id="search-input" type="search" placeholder="id, title, evidence...">
        </label>
        <label>
          Status
          <select id="status-filter">
            <option value="all">all</option>
            <option value="open">open</option>
            <option value="doing">doing</option>
            <option value="blocked">blocked</option>
            <option value="resolved">resolved</option>
            <option value="ignored">ignored</option>
          </select>
        </label>
        <label>
          Risk
          <select id="risk-filter">
            <option value="all">all</option>
            <option value="critical">critical</option>
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
          </select>
        </label>
      </div>
    </section>

    <section class="issues-section" aria-labelledby="issues-title">
      <div class="section-heading">
        <h2 id="issues-title">Issues</h2>
        <p id="issue-count">0 issues</p>
      </div>
      <div id="issues-list" class="issues-list">
        <article class="empty-state">
          <h3>표시할 이슈가 없습니다.</h3>
          <p><code>.proofline/issues</code>에 등록된 이슈가 아직 없습니다.</p>
        </article>
      </div>
    </section>
  </main>

  <template id="issue-template">
    <article class="issue-card">
      <div class="issue-card-header">
        <div>
          <p class="issue-id"></p>
          <h3 class="issue-title"></h3>
        </div>
        <div class="badges">
          <span class="badge status-badge"></span>
          <span class="badge risk-badge"></span>
        </div>
      </div>
      <dl class="issue-meta">
        <div>
          <dt>Discovered while</dt>
          <dd class="issue-discovered"></dd>
        </div>
        <div>
          <dt>Suggested next step</dt>
          <dd class="issue-next-step"></dd>
        </div>
      </dl>
      <div class="issue-evidence"></div>
      <details class="issue-body-wrap">
        <summary>Markdown body</summary>
        <div class="issue-body markdown-body"></div>
      </details>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
